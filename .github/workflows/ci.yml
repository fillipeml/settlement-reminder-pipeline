name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: lint + tests + demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (offline)
        run: uv run pytest -q

      - name: Fixtures are current
        run: |
          uv run python scripts/make_fixtures.py
          git diff --exit-code --stat -- fixtures

      - name: Demo run, twice (the second must be idempotent)
        env:
          DEMO_MODE: "true"
          DRY_RUN: "false"
        run: |
          uv run settlement-reminders
          uv run settlement-reminders
          uv run settlement-agreements list --demo
          uv run settlement-agreements holds --demo
          uv run settlement-audit --demo
          ls .demo/outbox

      - name: Demo run on the escalation day
        env:
          DEMO_MODE: "true"
          DRY_RUN: "false"
        run: |
          for day in 2026-09-21 2026-09-23 2026-09-25 2026-09-29 2026-10-01; do
            uv run settlement-reminders --date "$day"
          done

      - name: Preview the templates
        run: |
          uv run preview-email reminder
          uv run preview-email collection

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
