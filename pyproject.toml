[project]
name = "settlement-reminder-pipeline"
version = "0.1.0"
description = "Daily pipeline that registers court settlements from a lawyer's notice e-mail, reminds the paying client before each installment, collects overdue ones every two business days, settles installments from receipts read by a language model and escalates to a human, with SQLite idempotency and a 'never collect from someone who may have paid' guard"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fillipe Loose" }]
keywords = ["legal-tech", "automation", "microsoft-graph", "claude-api", "sqlite", "email"]
dependencies = [
  "pydantic[email]>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "msal>=1.28,<2",
  "jinja2>=3.1,<4",
  "anthropic>=1.8",
  "tenacity>=8.3",
  "tzdata>=2024.1",
  "python-dateutil>=2.9,<3",
  "num2words>=0.5.13",
  "holidays>=0.50",
]

[project.scripts]
settlement-reminders = "settlement_reminders.cli:run_main"
settlement-agreements = "settlement_reminders.cli:manage_main"
settlement-audit = "settlement_reminders.cli:audit_main"
preview-email = "settlement_reminders.cli:preview_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/settlement_reminders"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.pycodestyle]
max-line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
